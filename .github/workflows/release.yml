# The release (IMPLEMENTATION.md Step 18; ADR 0027, 0036, 0037), started by hand with the version to ship:
# 1. one job per OS and architecture builds the installers, unsigned (ADR 0036: re-signed ad hoc on macOS), checks
#    them (A18.1) and keeps them with their update feed files. The tool catalog is inside the app (ADR 0037).
# 2. the release job merges each OS's feed files, starts the staged rollout at the share given, and makes a draft
#    release: a person publishes it after the release candidate passed the nightly suite (A18.6)
# Actions are pinned to full commit SHAs: a tag can be moved to other code, a commit can't.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to ship, e.g. 1.0.0 (apps/desktop/package.json must say the same)
        required: true
      rollout:
        description: The share of users offered the version at first, in percent (scripts/release-feeds.ts rollout)
        required: true
        default: '10'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest, arch: arm64 }
          - { os: macos-15-intel, arch: x64 }
          - { os: windows-latest, arch: x64 }
          - { os: windows-11-arm, arch: arm64 }
          - { os: ubuntu-latest, arch: x64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: The version matches
        shell: bash
        run: test "$(node -p "require('./apps/desktop/package.json').version")" = "${{ inputs.version }}"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Installers
        run: node apps/desktop/scripts/build.ts production --installers --arch=${{ matrix.arch }}
      - name: The installers are whole (A18.1)
        shell: bash
        run: node scripts/verify-installers.ts apps/desktop/release/production-*-${{ matrix.arch }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ runner.os }}-${{ matrix.arch }}
          path: |
            apps/desktop/release/production-*/*.dmg
            apps/desktop/release/production-*/*.zip
            apps/desktop/release/production-*/*.exe
            apps/desktop/release/production-*/*.AppImage
            apps/desktop/release/production-*/*.deb
            apps/desktop/release/production-*/*.rpm
            apps/desktop/release/production-*/*.blockmap
            apps/desktop/release/production-*/latest*.yml
          if-no-files-found: error

  release:
    needs: [package]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: The installers of every job
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ github.run_id }} --pattern 'release-*' --dir downloaded
      - name: One feed file per name, with the staged rollout
        run: |
          mkdir -p assets
          find downloaded -type f ! -name 'latest*.yml' -exec cp {} assets/ \;
          node scripts/release-feeds.ts merge assets $(find downloaded -name 'latest*.yml' -exec dirname {} \; | sort -u)
          node scripts/release-feeds.ts rollout assets ${{ inputs.rollout }}
      # The tag goes on the commit that the installers were built from. Without --target, the release's target is the
      # default branch, and the tag of a draft is made only when a person publishes it: at main's newest commit then.
      - name: A draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v${{ inputs.version }}" --draft --target "${{ github.sha }}" --title "${{ inputs.version }}"
          --generate-notes assets/*
