# Every pull request and every push to develop or main, on macOS, Windows and Linux.
# Actions are pinned to full commit SHAs: a tag can be moved to other code, a commit can't.
name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Electron 44 doesn't download its binary at install; pnpm dev runs it.
      - run: node apps/desktop/node_modules/electron/install.js

      # 1. Lint, formatting, types, the architecture rules, the brand check and the dependency rules
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm arch
      - run: pnpm brand:check
      - run: pnpm deps:check

      # 2. The two builds: the production build, and the development build that pnpm dev starts
      - run: pnpm build:prod
      - run: pnpm build:test
